<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078d4" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f48771" />
      <stop offset="100%" stop-color="#d9534f" />
    </linearGradient>
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#89d185" />
      <stop offset="100%" stop-color="#4caf50" />
    </linearGradient>
  </defs>

  <!-- Background rounded box -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1e1e1e" stroke="#3e3e42" stroke-width="2"/>

  <!-- Left code bracket / diff pane (red-ish) -->
  <path d="M22 18 L14 26 L22 34" fill="none" stroke="url(#leftGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right code bracket / diff pane (green-ish) -->
  <path d="M42 18 L50 26 L42 34" fill="none" stroke="url(#rightGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center comparison arrows ⟺ -->
  <path d="M20 46 H44" fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M26 40 L18 46 L26 52" fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 40 L46 46 L38 52" fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Divider indicator line -->
  <line x1="32" y1="16" x2="32" y2="34" stroke="#55555c" stroke-width="2" stroke-dasharray="2 2" stroke-linecap="round"/>
</svg>
